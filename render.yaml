services:
  # PostgreSQL Database
  - type: pserv
    name: drafty-db
    env: docker
    plan: starter
    region: oregon
    
  # HTTP API Server
  - type: web
    name: drafty-http-api
    env: docker
    dockerfilePath: ./apps/http-server/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: drafty-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: FRONTEND_ORIGIN
        value: https://drafty.vercel.app
      - key: SALTROUNDS
        value: 10
    healthCheckPath: /api/v1/health
    
  # WebSocket Server  
  - type: web
    name: drafty-ws
    env: docker
    dockerfilePath: ./apps/ws-server/Dockerfile
    dockerContext: .
    region: oregon
    plan: starter
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 8080
      - key: DATABASE_URL
        fromDatabase:
          name: drafty-db
          property: connectionString
      - key: JWT_SECRET
        sync: false

databases:
  - name: drafty-db
    databaseName: drafty_production
    user: drafty_user
    plan: starter
    region: oregon
